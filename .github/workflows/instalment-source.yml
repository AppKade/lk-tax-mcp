name: Instalment source evidence
on:
  push:
    branches: [feat/instalment-planning]
    paths: [.github/workflows/instalment-source.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir evidence
          curl --fail --retry 2 --max-time 60 'https://www.ird.gov.lk/en/publications/Circulars_Circulars/SEC_2026_E_06_ReRiv_E.pdf' -o evidence/SEC_2026_E_06_ReRiv_E.pdf
          sha256sum evidence/*.pdf > evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: official-instalment-source
          path: evidence/
          retention-days: 7
